<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APP CALIDAD · Jamones Granadinos</title>
<meta name="theme-color" content="#7A1F2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calidad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F5F0E8; --card:#FFFDF9; --ink:#2A1A14; --muted:#7A6A60; --line:#E3D9CC;
  --brand:#7A1F2B; --brand-d:#5E1520; --brand-l:#F3E3E1;
  --ok:#2E7D4F; --ok-l:#E2F2E7; --bad:#B3261E; --bad-l:#FBE4E2; --warn:#A86500; --warn-l:#FFF1D6;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .t{font-weight:700;font-size:24px;letter-spacing:.02em}
header.top .s{font-size:16px;opacity:.85}
#sync{margin-left:auto;cursor:pointer;border:0;font-size:16px;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.15);white-space:nowrap}
#sync.ok{background:#E2F2E7;color:var(--ok)}
#sync.pend{background:var(--warn-l);color:var(--warn)}
#sync.off{background:#fff;color:var(--muted)}
#sync.bad{background:var(--bad-l);color:var(--bad)}
#gear{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:26px;width:52px;height:52px;border-radius:50%;cursor:pointer}
textarea.code{font-family:ui-monospace,monospace;font-size:16px;min-height:110px}
ol.steps{padding-left:24px;margin:8px 0}ol.steps li{margin-bottom:6px}
main{max-width:980px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:32px;margin:6px 0 18px}
h2{font-size:24px;margin:26px 0 12px}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:170px;padding:24px;border-radius:22px;border:2px solid var(--line);background:var(--card);text-align:left;cursor:pointer}
.tile .ic{font-size:44px;line-height:1}
.tile .tt{font-size:28px;font-weight:700}
.tile .ds{font-size:18px;color:var(--muted)}
.tile.on{border-color:var(--brand);box-shadow:0 4px 0 var(--brand-d)}
.tile.on:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.tile.soon{opacity:.55;cursor:default}
.tag{display:inline-block;font-size:15px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--muted)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 26px;border-radius:var(--r);border:2px solid var(--brand);background:var(--card);color:var(--brand);font-weight:700;font-size:22px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn.big{min-height:84px;font-size:26px;width:100%}
.btn.ghost{border-color:transparent;background:transparent;padding-left:6px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1}
.back{font-size:22px;font-weight:600;color:var(--brand);background:none;border:0;padding:10px 0;cursor:pointer;min-height:56px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px}
.list{display:flex;flex-direction:column;gap:12px}
.lote{display:flex;gap:16px;align-items:center;width:100%;text-align:left;cursor:pointer}
.lote .li{font-size:26px;font-weight:700}
.lote .meta{color:var(--muted);font-size:18px}
.lote .n{margin-left:auto;text-align:center;min-width:90px}
.lote .n b{display:block;font-size:34px;line-height:1}
.lote .n span{font-size:15px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--warn);display:inline-block;margin-left:6px;vertical-align:middle}
form .f{margin-bottom:18px}
label.l{display:block;font-weight:600;font-size:19px;margin-bottom:6px}
.req{color:var(--bad)}
input.in,textarea.in,select.in{width:100%;min-height:64px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:26px}
textarea.in{min-height:96px;font-size:22px}
select.in{font-size:20px;font-weight:600}
@media (max-width:640px){select.in{font-size:16px}.ntest b{font-size:44px}}
input.in:focus,textarea.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
input.in.err{border-color:var(--bad);background:var(--bad-l)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:64px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:700;cursor:pointer}
.seg button.si.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.yn{display:grid;grid-template-columns:1fr 260px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.yn:last-child{border-bottom:0}
.yn .q{font-weight:600}
@media (max-width:640px){.yn{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{min-height:58px;padding:8px 18px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:21px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ntest{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.ntest b{font-size:56px;line-height:1;color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px}
.stat span{font-size:15px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
table.t{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;font-size:19px}
table.t th{background:var(--brand-l);text-align:left;padding:10px;font-size:16px}
table.t td{padding:12px 10px;border-top:1px solid var(--line)}
table.t tr.click{cursor:pointer}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;font-size:18px}
.kv div span{display:block;color:var(--muted);font-size:15px}
.kv div b{font-weight:600}
.bar{position:sticky;bottom:0;margin:22px -18px 0;background:var(--card);border-top:2px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:4}
.bar .in2{max-width:980px;margin:0 auto;display:flex;gap:12px}
.bar .in2 .btn{flex:1}
#modal{position:fixed;inset:0;background:rgba(42,26,20,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:20px;padding:26px;max-width:520px;width:100%}
#modal .box p{font-size:22px;margin:0 0 22px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;font-size:20px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
.salas{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:8px}
.sala{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:left;cursor:pointer}
.sala .sn{font-weight:700;font-size:21px;line-height:1.15}
.sala .sv{font-size:19px;font-variant-numeric:tabular-nums}
.sala .ss{font-size:15px;font-weight:700;margin-top:auto}
.sala.done{background:var(--ok-l);border-color:var(--ok)} .sala.done .ss{color:var(--ok)}
.sala.inc{background:var(--bad-l);border-color:var(--bad)} .sala.inc .ss{color:var(--bad)}
.sala.pend .ss{color:var(--bad)}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.daynav button{min-width:64px;min-height:64px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:28px;cursor:pointer}
.daynav button[disabled]{opacity:.3}
.daynav .d{flex:1;text-align:center}
.daynav .d b{display:block;font-size:26px}
.prog{height:16px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--ok)}
.estado{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.estado button{min-height:84px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:23px;font-weight:700;cursor:pointer}
.estado .ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.estado .ko.on{background:var(--bad);border-color:var(--bad);color:#fff}
.bignum{font-size:34px!important;font-weight:700;text-align:center}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tipos button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer;padding:8px 12px}
.tipos button.on{background:var(--bad);border-color:var(--bad);color:#fff}
.fotobtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:84px;border-radius:16px;border:3px dashed var(--brand);color:var(--brand);font-size:23px;font-weight:700;cursor:pointer;background:#fff}
.fotobtn input{display:none}
.preview{max-width:100%;max-height:340px;border-radius:14px;display:block;margin:0 auto 10px}
.inc{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;cursor:pointer}
.inc .ib{flex:1}
.inc .it{font-size:22px;font-weight:700}
.inc .im{color:var(--muted);font-size:17px}
.inc .in3{margin-top:6px;font-size:19px}
.thumb{width:96px;height:96px;object-fit:cover;border-radius:12px;background:var(--line)}
.tallas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tallas button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:86px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.tallas button b{font-size:26px}
.tallas button span{font-size:15px;color:var(--muted)}
.tallas button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tallas button.on span{color:#f3d9dc}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.dest button{min-height:62px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:19px;font-weight:700;cursor:pointer;padding:6px 10px}
.dest button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tgrid{display:grid;grid-template-columns:70px 1fr 1fr;gap:10px;align-items:center}
.tgrid .tl{font-size:26px;font-weight:700;text-align:center}
.tgrid .th{font-size:15px;color:var(--muted);font-weight:600}
.tgrid input.in{min-height:56px;font-size:24px;text-align:center}
.aviso{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;border-radius:14px;padding:12px 16px;border:2px solid var(--warn);background:var(--warn-l);margin-bottom:10px;font-size:19px}
.aviso.tarde{border-color:var(--bad);background:var(--bad-l)}
.aviso b{font-size:20px}
.hist{border-left:4px solid var(--line);padding:6px 0 6px 14px;margin-bottom:10px;cursor:pointer}
.hist b{font-size:19px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.ferr{color:var(--bad);font-size:17px;margin-top:4px}
.search{margin-bottom:14px}
</style>
</head>
<body>
<header class="top">
  <div><div class="t">APP CALIDAD</div><div class="s">Jamones Granadinos</div></div>
  <button id="sync" class="off">…</button><button id="gear" aria-label="Ajustes">⚙</button>
</header>
<main id="app"></main>
<div id="modal"><div class="box"><p id="mtext"></p><div class="row"><button class="btn grow" id="mno">Cancelar</button><button class="btn pri grow" id="myes">Sí</button></div></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ Constantes ============ */
const RESP_DEF = "CECILIO RODRIGUEZ";
const TIPOS = ["JAMON SIN PATA FINO", "JAMON SIN PATA SEMIGRASO", "JAMON SIN PATA GRASO", "JAMON SIN PATA DUROC", "JAMON SIN PATA ECOLOGICO", "JAMON SIN PATA CORTE \"V\"", "JAMON CON PATA CORTE \"V\" FINO", "JAMON CON PATA CORTE \"V\" SEMIGRASO", "JAMON CON PATA CORTE \"V\" GRASO", "JAMON CON PATA CORTE \"V\" DUROC", "JAMON CON PATA CORTE \"V\" POLONIA", "JAMON CON PATA CORTE \"V\" DUROC EXTRA", "JAMON CON PATA CORTE \"V\" DUROC EXTRA CAMPO", "JAMON CON PATA CORTE \"V\" ECOLOGICO", "JAMON PIEL Y PATA FINO", "JAMON PIEL Y PATA SEMIGRASO", "JAMON PIEL Y PATA GRASO", "JAMON PIEL Y PATA DUROC", "JAMON PIEL Y PATA DUROC SEMI", "JAMON PIEL Y PATA ECOLOGICO", "PALETA PIEL Y PATA FINA", "PALETA PIEL Y PATA SEMIGRASA", "PALETA PIEL Y PATA GRASA", "PALETA PIEL Y PATA DUROC", "JAMON DE CEBO IBERICO", "JAMON DE BELLOTA IBERICO", "PALETA DE CEBO IBERICA", "PALETA DE BELLOTA IBERICA", "PALETA DE CEBO DE CAMPO IBERICA", "PALETA CON PATA CORTE \"V\" FINA", "PALETA CON PATA CORTE \"V\" SEMIGRASA", "PALETA CON PATA CORTE \"V\" GRASA", "PALETA CON PATA CORTE \"V\" DUROC", "JAMON SPECK SIN PIEL", "JAMON CON PATA CORTE \"V\" NAB DUROC", "LOMO 50% DUROC CON PIEL"];
const LOTES_COLS = ["Lote interno","Fecha entrada","Proveedor","Lote de origen","Albarán/Factura","DAC","Nº piezas lote","Peso total lote (kg)","Productos revisados conformes","Documentación revisada","Cumple especificaciones","Apto exportación","Destino si no apto","Responsable","Hallazgos"];
const TEST_COLS = ["Lote interno","Fecha","Nº testigo","Nº pieza","Tipo","Peso (kg)","Clasificación","Tª (ºC)","pH","Grasa","ETG","Observaciones"];
const YN = [["prodConformes","¿Revisados conformes los productos?"],["docRevisada","¿Se ha revisado toda la documentación?"],["cumpleEspec","¿Documentación y proveedor cumplen las especificaciones?"],["aptoExport","¿Apto para exportación?"]];
const LSKEY = "appcalidad.v1";
const APP_VERSION = "3.10 · 09/11/2026";
const SINO = ["Productos revisados conformes","Documentación revisada","Cumple especificaciones","Apto exportación"];
const TABLAS = {
  Lotes:{ cab:[...LOTES_COLS,"ID app"], k:"ID app", ocultas:["ID app"], orden:[["Fecha entrada",1]],
    fmt:Object.assign(Object.fromEntries(LOTES_COLS.map(c=>[c,"@"])),{"Fecha entrada":"dd/mm/yyyy","Nº piezas lote":"0","Peso total lote (kg)":"#,##0.00"}) },
  Testigos:{ cab:[...TEST_COLS,"ID testigo app","ID lote app"], k:"ID testigo app", ocultas:["ID testigo app","ID lote app"], orden:[["Fecha",1],["Lote interno",1],["Nº testigo",1]],
    fmt:{"Lote interno":"@","Fecha":"dd/mm/yyyy","Nº testigo":"@","Nº pieza":"@","Tipo":"@","Peso (kg)":"0.00","Clasificación":"@","Tª (ºC)":"0.0","pH":"0.00","ETG":"@","Observaciones":"@"} },
  Temperaturas:{ cab:["Fecha","Sala","Tª (ºC)","HR (%)","Horas funcionamiento","Estado","Incidencia","Hora registro","ID app","Orden"], k:"ID app", ocultas:["ID app","Orden"], orden:[["Fecha",1],["Orden",1]],
    fmt:{"Fecha":"dd/mm/yyyy","Sala":"@","Tª (ºC)":"0.0","HR (%)":"0.0","Horas funcionamiento":"0.0","Estado":"@","Incidencia":"@","Hora registro":"@"} }
};
TABLAS.Tallas={ cab:["Lote interno","Tipo","Talla","Nº piezas","Días de sal","Entrada en sal","Salida de sal prevista","Ubicación actual","Desde","ID app","ID lote"], k:"ID app", ocultas:["ID app","ID lote"],
  orden:[["Lote interno",1],["Tipo",1],["Orden talla",1]], fmt:{"Lote interno":"@","Tipo":"@","Talla":"@","Nº piezas":"0","Días de sal":"0","Entrada en sal":"dd/mm/yyyy","Salida de sal prevista":"dd/mm/yyyy","Ubicación actual":"@","Desde":"dd/mm/yyyy"} };
TABLAS.Tallas.cab.push("Orden talla"); TABLAS.Tallas.ocultas.push("Orden talla");
TABLAS.Movimientos={ cab:["Fecha","Lote interno","Tipo","Talla","Nº piezas","Desde","Hacia","Hora registro","ID app","ID mov","ID lote","Código hacia","TS"], k:"ID app",
  ocultas:["ID app","ID mov","ID lote","Código hacia","TS"], orden:[["Fecha",1],["TS",1],["Lote interno",1]],
  fmt:{"Fecha":"dd/mm/yyyy","Lote interno":"@","Tipo":"@","Talla":"@","Nº piezas":"0","Desde":"@","Hacia":"@","Hora registro":"@","Código hacia":"@"} };
function tallasFilas(l){ const u=ubicaciones(l); return tallasDe(l).map(t=>({"Lote interno":l.loteInterno,"Tipo":kTipo(t),"Talla":kTalla(t),"Nº piezas":l.tallas[t].n,"Días de sal":l.tallas[t].diasSal,
  "Entrada en sal":dmy(entradaSal(l,t)),"Salida de sal prevista":dmy(salidaSal(l,t,u[t])),"Ubicación actual":u[t]&&SALA[u[t].dest]?SALA[u[t].dest].n:"","Desde":u[t]?dmy(u[t].fecha):"",
  "ID app":l.id+"_"+t,"ID lote":l.id,"Orden talla":TALLAS.indexOf(kTalla(t))+1})); }
function movFilas(l){ const r=[]; (l.movs||[]).forEach(m=>m.tallas.forEach(t=>r.push({"Fecha":dmy(m.fecha),"Lote interno":l.loteInterno,"Tipo":kTipo(t),"Talla":kTalla(t),"Nº piezas":m.piezas&&m.piezas[t]!=null?m.piezas[t]:(l.tallas[t]?l.tallas[t].n:""),
  "Desde":m.desde&&m.desde[t]&&SALA[m.desde[t]]?SALA[m.desde[t]].n:"","Hacia":SALA[m.destino]?SALA[m.destino].n:m.destino,"Hora registro":m.ts?new Date(m.ts).toTimeString().slice(0,5):"",
  "ID app":m.mid+"_"+t,"ID mov":m.mid,"ID lote":l.id,"Código hacia":m.destino,"TS":m.ts||0}))); return r; }
TABLAS["Lotes anteriores"]={ cab:["Lote interno","Fecha entrada","Observaciones","ID app"], k:"ID app", ocultas:["ID app"], orden:[["Lote interno",1]],
  fmt:{"Lote interno":"@","Fecha entrada":"dd/mm/yyyy","Observaciones":"@"} };
TABLAS.Manteca={ cab:["Fecha","Lote","Tipo","Talla","Nº piezas","Hora registro","ID app","ID lote"], k:"ID app", ocultas:["ID app","ID lote"], orden:[["Fecha",1],["Hora registro",1]],
  fmt:{"Fecha":"dd/mm/yyyy","Lote":"@","Tipo":"@","Talla":"@","Nº piezas":"0","Hora registro":"@"} };
const mantFila = x => ({"Fecha":dmy(x.fecha),"Lote":x.lote,"Tipo":x.tipo||"","Talla":x.talla,"Nº piezas":x.piezas,"Hora registro":x.hora,"ID app":x.id,"ID lote":x.loteId||""});
TABLAS.Incidencias={ cab:["Fecha","Hora","Sala","Tipo","Descripción","Foto","Origen","ID app","Orden"], k:"ID app", ocultas:["ID app","Orden"], orden:[["Fecha",1],["Hora",1]],
  fmt:{"Fecha":"dd/mm/yyyy","Hora":"@","Sala":"@","Tipo":"@","Descripción":"@","Foto":"@","Origen":"@"} };
const dmy = f => f ? f.split("-").reverse().join("/") : "";

/* fotos pendientes de enviar: se guardan en el dispositivo (IndexedDB) */
const fotosDB=(()=>{ const mem={}; let dbp=null;
  function open(){ if(!dbp) dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open("appcalidad-fotos",1); r.onupgradeneeded=()=>r.result.createObjectStore("f"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  async function tx(mode,fn){ const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction("f",mode), rq=fn(t.objectStore("f")); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); }); }
  return { put:(k,v)=>tx("readwrite",s=>s.put(v,k)).catch(()=>{ mem[k]=v; }),
           get:k=>tx("readonly",s=>s.get(k)).then(v=>v||mem[k]).catch(()=>mem[k]),
           del:k=>{ delete mem[k]; return tx("readwrite",s=>s.delete(k)).catch(()=>{}); } }; })();
async function comprimir(file){
  const url=URL.createObjectURL(file); const img=new Image();
  try{ await new Promise((r,j)=>{ img.onload=r; img.onerror=j; img.src=url; });
    const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.72); } finally { URL.revokeObjectURL(url); }
}

function saveLect(next){

function leerGrupos(grupos){
  document.querySelectorAll("[data-gt]").forEach(e=>{ const g=grupos[+e.dataset.gt]; if(g) g.tipo=e.value; });
  document.querySelectorAll("[data-gn]").forEach(e=>{ const [i,t]=e.dataset.gn.split("|"); if(grupos[+i]) grupos[+i].n[t]=e.value; });
  document.querySelectorAll("[data-gd]").forEach(e=>{ const [i,t]=e.dataset.gd.split("|"); if(grupos[+i]) grupos[+i].d[t]=e.value; });

/* devuelve {err, tallas:{clave:{n,diasSal}}, sala:{clave:sala}} */
function validarGrupos(grupos){
  let err=""; const tallas={}, sala={}, vistos=new Set();
  document.querySelectorAll("[data-gn],[data-gd]").forEach(e=>e.classList.remove("err"));
  grupos.forEach((g,i)=>{ if(vistos.has(g.tipo)) err="Hay dos grupos con el mismo tipo de producto"; vistos.add(g.tipo);
    TALLAS.forEach(t=>{ const n=parseNum(g.n[t]), d=parseNum(g.d[t]);
      if(Number.isNaN(n)||(n!=null&&(n<0||!Number.isInteger(n)))){ const e=document.querySelector(`[data-gn="${i}|${t}"]`); e&&e.classList.add("err"); err=err||"Escribe números enteros"; }
      if(Number.isNaN(d)||(d!=null&&(d<0||!Number.isInteger(d)))){ const e=document.querySelector(`[data-gd="${i}|${t}"]`); e&&e.classList.add("err"); err=err||"Escribe números enteros"; }
      if(n>0){ const k=mkKey(g.tipo,t); tallas[k]={n,diasSal:Number.isNaN(d)?null:d}; if(g.sala[t]) sala[k]=g.sala[t]; } }); });
  if(!err && !Object.keys(tallas).length) err="Escribe las piezas de al menos una talla";
  return {err,tallas,sala};
}

async function sync(manual){
  if(!cfg||syncing){ updateSync(); return; }
  if(!navigator.onLine){ updateSync(); if(manual) toast("Sin conexión: los datos siguen guardados"); return; }
  syncing=true; net="sending"; updateSync();
  try{
    Object.keys(state.pend).forEach(id=>{ if(!state.lotes[id]) delete state.pend[id]; });
    Object.keys(state.pendT).forEach(id=>{ if(!state.lect[id]) delete state.pendT[id]; });
    const put=[], upd=[], del=[], sentL={}, sentT={};
    for(const id of Object.keys(state.pend)){ const l=state.lotes[id]; sentL[id]=l.updatedAt;
      if(l.deleted){ del.push({t:"Lotes",col:"ID app",val:id},{t:"Lotes anteriores",col:"ID app",val:id},{t:"Testigos",col:"ID lote app",val:id},{t:"Tallas",col:"ID lote",val:id},{t:"Movimientos",col:"ID lote",val:id}); continue; }
      if(l.anterior) put.push({t:"Lotes anteriores",fila:{"Lote interno":l.loteInterno,"Fecha entrada":dmy(l.fechaEntrada),"Observaciones":l.obs||"","ID app":l.id}});
      else put.push({t:"Lotes",fila:loteFila(l)});
      (l.testigos||[]).forEach(t=>put.push({t:"Testigos",fila:testFila(l,t)}));
      upd.push({t:"Testigos",col:"ID lote app",val:id,set:{"Lote interno":l.loteInterno}});
      (l.delTids||[]).forEach(tid=>del.push({t:"Testigos",col:"ID testigo app",val:tid}));
      tallasFilas(l).forEach(f=>put.push({t:"Tallas",fila:f}));
      movFilas(l).forEach(f=>put.push({t:"Movimientos",fila:f}));
      upd.push({t:"Tallas",col:"ID lote",val:id,set:{"Lote interno":l.loteInterno}},{t:"Movimientos",col:"ID lote",val:id,set:{"Lote interno":l.loteInterno}});
      (l.delOps||[]).forEach(o=>del.push(o));
    }
    for(const id of Object.keys(state.pendT)){ const x=state.lect[id]; sentT[id]=x.updatedAt;
      if(x.deleted) del.push({t:"Temperaturas",col:"ID app",val:id}); else put.push({t:"Temperaturas",fila:lectFila(x)});
      if(!x.deleted && x.estado==="INCIDENCIA") put.push({t:"Incidencias",fila:{"Fecha":dmy(x.fecha),"Hora":x.hora,"Sala":x.salaNombre,"Tipo":"Ronda de temperaturas",
        "Descripción":x.incidencia,"Foto":"","Origen":"Ronda de temperaturas","ID app":"T_"+id,"Orden":x.orden}});
      else del.push({t:"Incidencias",col:"ID app",val:"T_"+id}); }
    const sentM={};
    Object.keys(state.pendM).forEach(id=>{ if(!state.mant[id]) delete state.pendM[id]; });
    for(const id of Object.keys(state.pendM)){ const x=state.mant[id]; sentM[id]=x.updatedAt;
      if(x.deleted) del.push({t:"Manteca",col:"ID app",val:id}); else put.push({t:"Manteca",fila:mantFila(x)}); }
    const archivos=[], sentI={};
    Object.keys(state.pendI).forEach(id=>{ if(!state.inc[id]) delete state.pendI[id]; });
    for(const id of Object.keys(state.pendI)){ const x=state.inc[id]; sentI[id]=x.updatedAt;
      if(x.deleted){ del.push({t:"Incidencias",col:"ID app",val:id}); continue; }
      let foto=x.fotoUrl||"";
      if(x.foto && !x.fotoUrl){ const data=await fotosDB.get(id);
        if(data){ archivos.push({id,nombre:"INC_"+x.fecha+"_"+x.sala+"_"+id+".jpg",tipo:"image/jpeg",datos:String(data).split(",")[1]}); foto="archivo:"+id; } }
      put.push({t:"Incidencias",fila:incFila(x,foto)}); }
    const res = await call("POST",{action:"sync",tablas:TABLAS,put,upd,del,archivos,
      leer:[{t:"Lotes"},{t:"Lotes anteriores"},{t:"Testigos"},{t:"Tallas"},{t:"Movimientos"},{t:"Temperaturas",colFecha:"Fecha",dias:60},{t:"Incidencias",colFecha:"Fecha",dias:60},{t:"Manteca",colFecha:"Fecha",dias:120}]});
    if(!(res.v>=3) || (archivos.length && !(res.v>=4))) throw new Error("version");

    for(const id in sentI) if(state.inc[id] && state.inc[id].updatedAt===sentI[id]) delete state.pendI[id];

  finally{ syncing=false; updateSync(); if(view.name==="ajustes") render(); }

}
function mergeServer(list, lects, incs, mants){

  if(incs){ const iids=new Set();
    for(const s of incs){ iids.add(s.id); if(state.pendI[s.id]) continue; const loc=state.inc[s.id];
      state.inc[s.id]=Object.assign(s,{synced:true,deleted:false,updatedAt:loc?loc.updatedAt:0}); }
    for(const id of Object.keys(state.inc)){ const x=state.inc[id]; if(!iids.has(id) && !state.pendI[id] && (x.synced||x.deleted)) delete state.inc[id]; } }
  if(mants){ const mids=new Set();
    for(const s of mants){ mids.add(s.id); if(state.pendM[s.id]) continue; const loc=state.mant[s.id];
      state.mant[s.id]=Object.assign(s,{synced:true,deleted:false,updatedAt:loc?loc.updatedAt:0,ts:loc?loc.ts:0}); }
    for(const id of Object.keys(state.mant)){ const x=state.mant[id]; if(!mids.has(id) && !state.pendM[id] && (x.synced||x.deleted)) delete state.mant[id]; } }
  persist(); if(!isForm() && view.name!=="ajustes") render();
}
function updateSync(){
  const el=$("#sync"); if(!el) return; const n=pendCount(), pl=n>1?"s":"";
  let cls="off", txt;
  if(!cfg){ cls="bad"; txt="⚙ Sin configurar"; }
  else if(!navigator.onLine){ cls="pend"; txt = n? `Sin conexión · ${n} pendiente${pl}` : "Sin conexión · todo guardado"; }
  else if(net==="sending"){ cls="pend"; txt="Sincronizando…"; }
  else if(net==="badkey"){ cls="bad"; txt="Clave incorrecta"; }
  else if(net==="oldscript"){ cls="bad"; txt="Falta actualizar el script"; }
  else if(net==="error"){ cls="pend"; txt = n? `Sin enviar · ${n} pendiente${pl}` : "Sin conexión con la hoja"; }
  else if(n){ cls="pend"; txt=`⏳ ${n} pendiente${pl}`; }
  else if(net==="ok"){ cls="ok"; txt="✓ Todo en Google Sheets"; }
  else txt="Conectando…";
  el.className=cls; el.textContent=txt;
}

/* ============ Exportar a Excel (xlsx sin librerías) ============ */
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  const now=new Date(), dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)), dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate());
  for(const [name,content] of files){
    const nb=enc.encode(name), data=enc.encode(content), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nb);
    off += 30+nb.length+data.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  const all=[...parts,...cd,new Uint8Array(e.buffer)], out=new Uint8Array(all.reduce((a,b)=>a+b.length,0)); let p=0; for(const a of all){ out.set(a,p); p+=a.length; }
  return out;
}
const xe = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colL = i => String.fromCharCode(65+i);
const serial = s => { const [y,m,d]=s.split("-").map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000; };

function buildXlsx(lotes){
  const ss=[], ssi=new Map();
  const S = v => { v=String(v); if(!ssi.has(v)){ ssi.set(v,ss.length); ss.push(v); } return ssi.get(v); };
  // estilos: 0 normal · 1 cabecera · 2 fecha · 3 0.00 · 4 #,##0.00 · 5 0.0 · 6 texto · 7 entero
  const sheet=(cols,widths,rows,tableRid)=>{
    let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>`;
    widths.forEach((w,i)=>x+=`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`);
    x+=`</cols><sheetData><row r="1">`+cols.map((c,i)=>`<c r="${colL(i)}1" s="1" t="s"><v>${S(c)}</v></c>`).join("")+`</row>`;
    rows.forEach((row,ri)=>{ const r=ri+2; x+=`<row r="${r}">`;
      row.forEach(([kind,v,st],ci)=>{ if(v==null||v===""||(typeof v==="number"&&isNaN(v))) return; const ref=colL(ci)+r;
        if(kind==="s") x+=`<c r="${ref}" s="${st||6}" t="s"><v>${S(v)}</v></c>`;
        else if(kind==="d") x+=`<c r="${ref}" s="2"><v>${serial(v)}</v></c>`;
        else x+=`<c r="${ref}" s="${st||0}"><v>${v}</v></c>`; });
      x+=`</row>`; });
    return x+`</sheetData><tableParts count="1"><tablePart r:id="${tableRid}"/></tableParts></worksheet>`;
  };
  const table=(id,name,cols,nrows)=>{ const ref=`A1:${colL(cols.length-1)}${Math.max(nrows,1)+1}`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><table xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" id="${id}" name="${name}" displayName="${name}" ref="${ref}" totalsRowShown="0"><autoFilter ref="${ref}"/><tableColumns count="${cols.length}">${cols.map((c,i)=>`<tableColumn id="${i+1}" name="${xe(c)}"/>`).join("")}</tableColumns><tableStyleInfo name="TableStyleMedium2" showFirstColumn="0" showLastColumn="0" showRowStripes="1" showColumnStripes="0"/></table>`; };

  const lr = lotes.map(l=>[["s",l.loteInterno],["d",l.fechaEntrada],["s",l.proveedor],["s",l.loteOrigen],["s",l.albaran],["s",l.dac],["n",l.nPiezas,7],["n",l.pesoTotal,4],["s",l.prodConformes],["s",l.docRevisada],["s",l.cumpleEspec],["s",l.aptoExport],["s",l.destinoNoApto],["s",l.responsable||RESP_DEF],["s",l.hallazgos]]);
  const tr = [];
  lotes.forEach(l=> ordenTest(l).forEach(t=> tr.push([["s",l.loteInterno],["d",t.fecha],["s",String(t.n)],["s",t.pieza],["s",t.tipo],["n",t.peso,3],["s",t.clas||""],["n",t.temp,5],["n",t.ph,3],["n",t.grasa,0],["s",t.etg],["s",t.obs]])));

  const s1=sheet(LOTES_COLS,[16,13,24,16,13,14,12,14,13,13,13,12,20,20,40],lr,"rId1");
  const s2=sheet(TEST_COLS,[16,12,11,11,16,11,13,10,9,9,8,40],tr,"rId1");
  const sst=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${ss.length}" uniqueCount="${ss.length}">${ss.map(s=>`<si><t xml:space="preserve">${xe(s)}</t></si>`).join("")}</sst>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="4"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="0.00"/><numFmt numFmtId="166" formatCode="#,##0.00"/><numFmt numFmtId="167" formatCode="0.0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="167" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const files=[
    ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/tables/table1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/><Override PartName="/xl/tables/table2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/></Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="Lotes" sheetId="1" r:id="rId1"/><sheet name="Testigos" sheetId="2" r:id="rId2"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="${R}/styles" Target="styles.xml"/><Relationship Id="rId4" Type="${R}/sharedStrings" Target="sharedStrings.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml",s1],
    ["xl/worksheets/sheet2.xml",s2],
    ["xl/worksheets/_rels/sheet1.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/table" Target="../tables/table1.xml"/></Relationships>`],
    ["xl/worksheets/_rels/sheet2.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/table" Target="../tables/table2.xml"/></Relationships>`],
    ["xl/tables/table1.xml",table(1,"tblLotes",LOTES_COLS,lr.length)],
    ["xl/tables/table2.xml",table(2,"tblTestigos",TEST_COLS,tr.length)],
    ["xl/styles.xml",styles],
    ["xl/sharedStrings.xml",sst],
  ];
  return zip(files);
}
window.__buildXlsx = buildXlsx;

async function exportXlsx(){
  const y=$("#expY").value;
  const ls=lotesVivos().filter(l=>!l.anterior).filter(l=>!y||(l.fechaEntrada||"").startsWith(y)).sort((a,b)=>(a.fechaEntrada||"").localeCompare(b.fechaEntrada||"")||(a.createdAt||0)-(b.createdAt||0));
  if(!ls.length){ toast("No hay lotes que exportar"); return; }
  const bytes=buildXlsx(ls);
  const name=`R-Evaluacion_en_entrada_${y||"todos"}_${today()}.xlsx`;
  const url=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const el=document.createElement("a"); el.href=url; el.download=name; document.body.appendChild(el); el.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); el.remove(); },3000);
  toast("Excel exportado");
}
